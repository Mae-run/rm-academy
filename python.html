        H.code("python", "list.py", [
          "v = []                    # 空 list（就是 C 的 vector/你手写的 IntVec）",

          "v.append(20)",
          "v.insert(0, 5)            # 头部插入 O(n)——和 vector 一样要搬移",
          "v.extend([30, 40])        # 批量追加",
          "",
          "v[0]                      # 10 随机访问 O(1)",
          "v[-1]                     # 40 倒数第一",
          "v[1:3]                    # [20, 30] 切片（新列表！浅拷贝）",
          "",
          "v.pop()                   # 尾部弹出",
          "v.remove(20)              # 按值删（O(n) 找到再删）",
          "del v[0]                  # 按下标删",
          "",

        H.sub("切片：指针算术的糖衣"),
        H.code("python", "slice.py", [
          "a = [0, 1, 2, 3, 4, 5]",
          "",
          "a[1:4]        # [1, 2, 3]     起始:结束（不含结束）",
          "a[:3]         # [0, 1, 2]     从头",
          "a[3:]         # [3, 4, 5]     到尾",
          "a[::2]        # [0, 2, 4]     步长 2",
          "a[::-1]       # [5, 4, 3, 2, 1, 0]  倒序（面试常客）",
          "a[1:5:2]      # [1, 3]        起始:结束:步长",
          "",
          "# C 里对应 arr+i, arr+j 那套指针算术，Python 包成了语法糖",
          "# 注意：切片产生新列表，改切片不影响原列表（浅拷贝）"

      ]},
      { id: "py-dict", title: "第 5 章 dict / set：哈希表的优雅形态", blocks: [

          "# dict = C 里手写哈希表，这里一行搞定",
          "motor = {",
          "    'id': 0x201,",
          "    'speed': 3.5,",
          "    'temp': 42.0,",
          "}",
          "",
          "motor['id']               # 读（key 不存在 → KeyError）",
          "motor.get('power', 0)     # 读（不存在给默认值——安全姿势）",
          "motor['kp'] = 10.0        # 写/增",
          "del motor['temp']         # 删",
          "'id' in motor             # True 成员判断 O(1)",
          "",
          "for k, v in motor.items():        # 遍历键值对",
          "    print(k, v)",
          "for k in motor.keys():   pass      # 只遍历键",
          "for v in motor.values(): pass      # 只遍历值",
          "",
          "# set：只有键没有值的 dict（去重神器）",
          "ids = {0x201, 0x202, 0x201}    # {0x201, 0x202} 自动去重",
          "ids.add(0x203); ids.discard(0x202)",
          "a & b, a | b, a - b           # 交/并/差"
        ].join("\n")),

        H.code("python", "counter.py", [

          "",
          "# 普通写法",
          "d = {}",
          "for w in words:",
          "    d[w] = d.get(w, 0) + 1",
          "",
          "# 标准库武器（正式代码用这个）",

          "c = Counter(words)",

      ]},

    { id: "stage-py-3", title: "第三阶段 · 函数与面向对象", chapters: [

          "",
          "# 默认参数（注意：默认值只在定义时求值一次！）",

          "",
          "# 关键字参数：调用时可指名道姓（超长参数列表的救星）",

          "",
          "# *args 收集位置参数成元组，**kwargs 收集关键字参数成字典",

          "",
          "plot(1, 2, 3, title='speed', color='r', linewidth=2)",
          "",
          "# 解包：调用时反向展开",
          "args = (1, 10)",
          "clamp(*args)             # clamp(1, 10)——等价 C 的手动拆"
        ].join("\n")),
        H.note("pitfall", "可变默认参数事故", "<code class='inline'>def f(items=[])</code>——这个空列表<b>所有调用共享</b>，上次 append 的东西还在！正确写法：<code class='inline'>def f(items=None): if items is None: items = []</code>。Python 面试第一坑。"),
      ]},
      { id: "py-class", title: "第 8 章 类：比 C++ 更轻的 OOP", blocks: [
        H.code("python", "class.py", [
          "class Motor:",
          "    # 类属性（所有实例共享，类似 C 静态成员）",
          "    max_current = 16384",
          "",
          "    def __init__(self, motor_id, kp=10.0):   # 构造函数",
          "        self.id = motor_id                   # self.显式声明实例属性",
          "        self.kp = kp",
          "        self.integ = 0.0",
          "",
          "    def calc(self, target, fb):              # 方法第一个参数永远是 self",
          "        err = target - fb",
          "        self.integ += err",
          "        return self.kp * err + 0.5 * self.integ",
          "",
          "    def __repr__(self):                      # print 时的样子",
          "        return f'Motor({self.id})'",
          "",
          "m = Motor(0x201)         # 不用 new",
          "m.calc(1.0, 0.8)         # 不用 m->，直接点",
          "print(m)                 # Motor(513)"
        ].join("\n")),
        H.sub("和 C++ 的关键差异"),
        H.table("OOP 对照", ["概念", "C++", "Python"], [
          ["构造", "类名同名构造函数", "<code class='inline'>__init__</code>"],
          ["this 指针", "隐式 this", "<b>显式 self</b>（第一个参数）"],
          ["访问控制", "private/protected/public", "约定：<code class='inline'>_name</code> 私有、<code class='inline'>__name</code> 名字改写"],
          ["继承", "class B : public A", "class B(A)"],
          ["多态", "virtual 函数", "<b>天然多态</b>（鸭子类型，不用 virtual）"],
          ["运算符重载", "operator+", "<code class='inline'>__add__</code> 等 dunder 方法"]
        ]),
        H.code("python", "dataclass.py", [
          "# dataclass：纯数据容器的极简写法（自动生成 __init__/__repr__）",
          "from dataclasses import dataclass",
          "",
          "@dataclass",
          "class Armor:",
          "    center: tuple",
          "    area: float",
          "    dist: float = 0.0       # 带默认值",
          "",
          "a = Armor((320, 240), 150.0, 3.2)",
          "print(a)        # Armor(center=(320, 240), area=150.0, dist=3.2)"
        ].join("\n")),
        H.pracRef("py-p6"),
      ]},
      { id: "py-file", title: "第 9 章 文件与异常", blocks: [
        H.code("python", "file_io.py", [
          "# with：Python 的 RAII（C++ FileGuard 的亲兄弟）",
          "with open('data.txt', 'r', encoding='utf-8') as f:   # 出块自动 close",
          "    text = f.read()               # 全读",
          "    # f.readline()                # 逐行",
          "",
          "with open('log.csv', 'w', encoding='utf-8') as f:    # 'w'覆盖 'a'追加",
          "    f.write('t,pos,vel\\n')",
          "    f.write(f'{0.01},{1.2},{0.5}\\n')",
          "",
          "# 异常：try/except（C 里靠返回值错误码，Python 靠异常）",
          "try:",
          "    with open('missing.txt') as f:",
          "        pass",
          "except FileNotFoundError:",
          "    print('文件不存在')",
          "except (ValueError, KeyError) as e:    # 多种异常一起接",
          "    print(f'数据错误: {e}')",
          "finally:",
          "    print('无论如何都执行（类似 C 的 goto cleanup）')"
        ].join("\n")),
        H.note("tip", "EAFP 哲学", "Python 文化是「先斩后奏」（Easier to Ask Forgiveness than Permission）：直接干，出异常再接。C 文化是「先问后做」（LBYL）：先 if 判断再执行。写 Python 别到处 if 检查，学会 try。"),
        H.pracRef("py-p4"),
      ]},
    ]},

          "c = np.zeros((480, 640, 3), dtype=np.uint8)   # BGR 彩图",
          "",
          "a.shape          # (4,)  形状（对应 C 的 rows/cols）",
          "a.dtype          # int64 元素类型（对应 C 的类型声明）",
          "a.ndim           # 维数",
          "c.shape          # (480, 640, 3)",
          "",
          "# 与 C 的本质区别：NumPy 运算是「整个数组同时算」（向量化）",
          "x = np.array([1.0, 2.0, 3.0])",
          "y = x * 2 + 1            # [3, 5, 7]  没有 for 循环！",
          "# C 里你得写 for(i=0;i<n;i++) y[i]=x[i]*2+1;",
          "# NumPy 底层是 C/BLAS 实现的循环，比 Python for 快 100 倍"
        ].join("\n")),

        H.code("python", "broadcast.py", [

          "",
          "# (480,640,3) + (3,) → 每个像素都加同一个偏移",
          "img2 = img + np.array([10, 0, -10], dtype=np.float32)   # B+10,G+0,R-10",
          "",
          "# (480,640,3) * 标量",
          "img3 = img * 0.5",
          "",
          "# 规则：从右对齐，各维度要么相等，要么有一个是 1（自动复制）",
          "# (480,640) * (640,) → 每行乘同一个向量 → 也合法"
        ].join("\n")),

          "import numpy as np",
          "import yaml",
          "",
          "def load_calibration(path):",
          "    with open(path) as f:",
          "        d = yaml.safe_load(f)",
          "    K = np.array(d['camera_matrix'])",
          "    D = np.array(d['dist_coeff']).reshape(-1)",
          "    return K, D",

          "    new_K, roi = cv2.getOptimalNewCameraMatrix(K, D, (w, h), 1)",
          "    und = cv2.undistort(img, K, D, None, new_K)",
          "    x, y, rw, rh = roi",
