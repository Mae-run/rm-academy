struct FFPID {
    float kp, ki, kd;
    float ff_kv;          // 速度前馈增益
    float ff_ka;          // 加速度前馈增益
    float integ = 0, prev_err = 0;

    float update(float target, float target_vel, float target_acc,
                 float measured, float dt) {
        float err = target - measured;

        // ---- 前馈:直接把目标的运动"喂"给输出 ----
        // 目标在动,我知道它下一刻在哪,提前给电机这个量
        float ff = ff_kv * target_vel + ff_ka * target_acc;

        // ---- 反馈:只纠残差 ----
        float p = kp * err;
        integ += ki * err * dt;
        integ = clamp(integ, -ilim, ilim);      // 积分限幅
        float d = kd * (err - prev_err) / dt;
        prev_err = err;

        return ff + p + integ + d;
    }
};
// 效果:目标匀速转,ff 项扛起大头,PID 误差≈0

class PID:
    def __init__(s, kp, ki, kd):
        s.kp,s.ki,s.kd = kp,ki,kd; s.i=0; s.pe=0
    def step(s, e, dt):
        s.i = np.clip(s.i + s.ki*e*dt, -5, 5)
        d = (e - s.pe)/dt; s.pe = e
        return s.kp*e + s.i + s.kd*d

dt, T = 0.001, 3.0
t = np.arange(0, T, dt)
target = np.sin(2*np.pi*t)                 # 目标正弦
tvel    = 2*np.pi*np.cos(2*np.pi*t)        # 目标速度(前馈用)
tacc    = -(2*np.pi)**2 * np.sin(2*np.pi*t)

def simulate(use_ff, ff_kv=1.0, ff_ka=0.15):
    pid = PID(kp=60, ki=80, kd=2)
    y, dy = 0.0, 0.0
    err_hist = []
    J, B = 0.02, 0.4                         # 云台模型
    for i in range(len(t)):
        e = target[i] - y
        u = pid.step(e, dt)
        if use_ff:

        ddy = (u - B*dy) / J                 # 动力学
        dy += ddy*dt; y += dy*dt
        err_hist.append(abs(e))
    return np.array(err_hist)

          solution: H.code("python", "cascade.py", `import numpy as np

def clamp(x, lo, hi): return max(lo, min(hi, x))

class PID:
    def __init__(s,kp,ki,kd,ilim=10):
        s.kp,s.ki,s.kd,s.ilim=kp,ki,kd,ilim;s.i=0;s.pe=None
    def __call__(s,e,dt):
        s.i=clamp(s.i+s.ki*e*dt,-s.ilim,s.ilim)
        d=0 if s.pe is None else (e-s.pe)/dt
        s.pe=e
        return s.kp*e+s.i+s.kd*d

# 电机模型: 一阶 dy/dt = (u - B*y - disturbance)/J
J, B = 0.02, 0.3

def run(cascade=True, T=4.0):
    dt = 0.001
    inner = PID(kp=2.0, ki=30, kd=0)      # 速度环
    outer = PID(kp=40, ki=0, kd=0.5)      # 位置环
    single = PID(kp=180, ki=200, kd=8)    # 单环(调到同等上升时间)
    y = dy = 0.0
    tgt = 1.0
    log = []
    for step in range(int(T/dt)):
        t = step*dt
        disturb = 3.0 if t > 2.0 else 0.0  # t=2s 负载扰动
        if cascade:
            if step % 10 == 0:              # 外环 100Hz
                vel_cmd = outer(tgt - y, dt*10)
                vel_cmd = clamp(vel_cmd, -8, 8)
            u = inner(vel_cmd - dy, dt)     # 内环 1kHz
        else:
            u = single(tgt - y, dt)
        ddy = (u - B*dy - disturb)/J
        dy += ddy*dt; y += dy*dt
        log.append((t, y))
    return np.array(log)

for name, cas in [("串级", True), ("单环", False)]:
    log = run(cas)
    settle = log[np.abs(log[:,1]-1)<0.05][:,0]
    print(f"{name}: 调节时间 {settle[0] if len(settle) else float('inf'):.2f}s"
          f" | 扰动后稳态误差 {abs(log[-1,1]-1):.3f}")
# 串级: 扰动被内环1ms压制,位置几乎不动

        H.code("python", "lqr.py", `import numpy as np
from scipy.linalg import solve_continuous_are

# 云台状态: x = [角度误差, 角速度]
A = np.array([[0, 1],
              [0, -B/J]])            # 云台动力学
Bm = np.array([[0],
               [1/J]])

# 权重: Q=状态误差多痛, R=控制量多贵
Q = np.diag([100.0,   # 角度误差权重(大=优先消除角度误差)
             1.0])    # 速度误差权重
R = np.array([[0.5]])  # 控制量权重(大=省力但慢)

# 解 Riccati 方程 → 最优增益
P = solve_continuous_are(A, Bm, Q, R)
K = np.linalg.inv(R) @ Bm.T @ P
print("LQR 增益 K =", K)
# u = -K @ x  就是「最优」的全状态反馈
# 调参=调 Q/R 比例,物理意义清晰:
#   想更快 → Q[0,0]×10
#   想省电/防饱和 → R×10`),

def solve_pitch(d, v=25.0, g=9.8):
    # 精确解: tan(θ) 的二次方程
    # d = v·cosθ·t; -Δh = v·sinθ·t - g·t²/2
    ratio = g*d / (v*v)

        err = 0 - h                        # 目标等高

K, G, V = 0.01, 9.8, 25.0

def fly(angle_deg, d_target=6.0, dt=0.0001):
    th = np.radians(angle_deg)
    x, y, vx, vy = 0.0, 0.0, V*np.cos(th), V*np.sin(th)
    while x < d_target and y > -0.5:
        v = np.hypot(vx, vy)
        ax = -K*v*vx; ay = -G - K*v*vy
        vx += ax*dt; vy += ay*dt
        x += vx*dt;  y += vy*dt
    return y                        # 落点高度(目标=0)

def solve(d=6.0):
    th = 2.0                        # 初值:无阻力近似解
    for _ in range(12):             # 二分/割线法
        h = fly(th, d)
        if abs(h) < 1e-4: break
        h2 = fly(th + 0.01, d)
        slope = (h2 - h) / 0.01
        th -= h / slope
    return th

angle = solve()
