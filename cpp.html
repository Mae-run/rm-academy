          "",
          "// 传值的问题：整份 vector 被复制一遍，1000 个目标 = 1000 次拷贝构造",

          "int *a = (int *)malloc(10 * sizeof(int));   // 还要强转、还要算大小",
          "free(a);",
          "",
          "// C++ 风格",
          "int *b = new int[10];        // 自动算大小、返回正确类型",
          "delete[] b;                  // 数组用 delete[]，单个用 delete",
          "",
          "Motor *m = new Motor(0x201); // 顺便调用构造函数！这是本质区别",
          "delete m;                    // 顺便调用析构函数"
        ].join("\n")),
        H.note("pitfall", "配对军规", "malloc↔free、new↔delete、new[]↔delete[]。<b>混用或错配都是未定义行为</b>。不过在你的代码里，裸 new 都应该被智能指针替代（第 8 章）。"),
        H.sub("RAII：C++ 最重要的思想，没有之一"),
        H.p("<b>资源获取即初始化</b>：把资源（内存/文件/串口/锁）的生死绑到对象的生死上。构造函数拿资源，析构函数还资源——C++ 保证栈对象离开作用域<b>必定</b>执行析构（哪怕抛异常）："),
        H.code("cpp", "raii.cpp", [

          "public:",

          "        if (!f_) throw std::runtime_error(\"open failed\");",
          "    }",
          "    ~FileGuard() { if (f_) std::fclose(f_); }   // 出作用域自动关",
          "",
          "    FileGuard(const FileGuard&) = delete;      // 禁拷贝：防止双重关闭",
          "    FileGuard& operator=(const FileGuard&) = delete;",
          "private:",
          "    std::FILE *f_;",
          "};",
          "",
          "void demo() {",
          "    FileGuard log(\"run.log\");   // 从这一行起文件必定被管理",

        ].join("\n")),

          "size_t n = s2.size();                 // O(1) 长度（C 的 strlen 是 O(n)）",

      ]},
      { id: "cpp-vector", title: "第 7 章 std::vector：会自己长大的数组 ★★★", blocks: [
        H.sub("对照 C 动态数组"),
        H.p("还记得你在 C 课手写的 IntVec 吗？capacity 翻倍扩容、realloc、手动 free——std::vector 就是它的工业成品版："),
        H.code("cpp", "vector.cpp", [
          "#include <vector>",
          "",
          "std::vector<int> v;                    // 空",
          "v.push_back(10);                       // 尾部追加（自动扩容）",
          "v.push_back(20);",
          "v.push_back(30);",
          "",
          "int x = v[1];                          // 随机访问 O(1)（就是 C 数组）",
          "int y = v.at(1);                       // 带越界检查版（会抛异常）",
          "size_t n = v.size();                   // 元素数",
          "size_t c = v.capacity();               // 已分配容量（观察 2 倍增长）",
          "",
          "v.pop_back();                          // 尾部弹出",
          "v.clear();                             // 清空（容量保留）",
          "v.reserve(1000);                       // 预分配：已知量级时避免反复扩容",
          "v.resize(5);                           // 改变 size（多的默认构造）",
          "",
          "if (v.empty()) { }"
        ].join("\n")),
        H.sub("内存视角：vector 的三兄弟"),
        H.code("text", "vector 内存模型", [
          "size()     已用元素数      ← 你关心的",
          "capacity() 已分配槽数      ← 分配器关心的",
          "当 size == capacity 再 push_back：",
          "  ① 分配 2 倍新内存 → ② 逐个搬移旧元素 → ③ 释放旧内存",
          "  （这就是为什么引用/指针/迭代器会失效！）",
          "",
          "工程优化：能预估量级就先 reserve(N)，一次分配到位"
        ].join("\n")),
        H.sub("迭代器失效：vector 的头号坑"),
        H.code("cpp", "iterator_invalidate.cpp", [
          "std::vector<int> v{1, 2, 3, 4};",
          "",
          "// 崩溃写法：erase 后 it 已失效，++it 是 UB",
          "// for (auto it = v.begin(); it != v.end(); ++it)",
          "//     if (*it % 2 == 0) v.erase(it);",
          "",
          "// 正确写法：erase 返回下一个有效迭代器",
          "for (auto it = v.begin(); it != v.end(); ) {",
          "    if (*it % 2 == 0) it = v.erase(it);",
          "    else ++it;",
          "}",
          "",
          "// 或者一步到位（现代 C++ 首选）：",
          "#include <algorithm>",
          "v.erase(std::remove_if(v.begin(), v.end(),",
          "                        [](int x) { return x % 2 == 0; }),",
          "         v.end());"
        ].join("\n")),
        H.table("其它常用容器一句话", ["容器", "一句话"], [

          ["std::set / unordered_set", "集合（去重）"],
          ["std::array&lt;T,N&gt;", "定长数组（编译期大小），替代 C 数组"]
        ]),

    { id: "stage-cpp-3", title: "第三阶段 · 面向对象与资源管理", chapters: [
      { id: "cpp-class", title: "第 8 章 类：结构体 + 函数 + 访问控制 ★★★", blocks: [
        H.sub("从 C 结构体到 C++ 类"),
        H.code("cpp", "class.cpp", [
          "// C 风格：数据是数据，函数是函数",
          "typedef struct { float kp, ki, kd, integ; } Pid;",
          "void pid_init(Pid *p, ...);",
          "float pid_calc(Pid *p, float target, float fb);",
          "",
          "// C++：数据和行为绑在一起，private 把内部状态藏起来",
          "class Pid {",
          "public:                              // 对外接口",
          "    Pid(float kp, float ki, float kd)  // 构造函数：诞生即初始化",
          "        : kp_(kp), ki_(ki), kd_(kd), integ_(0.f) {}",
          "",
          "    float calc(float target, float fb) {   // 成员函数",
          "        float err = target - fb;",
          "        integ_ += err;",
          "        return kp_ * err + ki_ * integ_;",
          "    }",
          "",
          "private:                             // 内部实现，外人碰不得",
          "    float kp_, ki_, kd_;",
          "    float integ_;",
          "};",
          "",
          "Pid pid(10.f, 0.5f, 0.f);     // 不可能忘调 init —— 构造函数管了",
          "float out = pid.calc(1.0f, 0.8f);"
        ].join("\n")),
        H.sub("构造/析构/初始化列表"),

          "public:",
          "    Motor(uint16_t id, float max_cur)     // 构造",
          "        : id_(id), max_cur_(max_cur), pos_(0.f) {   // 初始化列表（比赋值高效）",
          "    }",
          "    ~Motor() { /* 释放资源（如有） */ }     // 析构：对象死亡时自动调用",
          "",
          "    Motor(const Motor&) = default;        // 拷贝构造（编译器可自动生成）",
          "    Motor& operator=(const Motor&) = default;",
          "private:",
          "    uint16_t id_;",
          "    float max_cur_;",
          "    float pos_;",
          "};"
        ].join("\n")),
        H.note("tip", "初始化列表 vs 构造体内赋值", "成员是 const、引用或没有默认构造的类时，<b>只能</b>用初始化列表。习惯：一律用列表，顺序按成员声明顺序写。"),
        H.sub("继承与虚函数：多态的钥匙"),
        H.code("cpp", "virtual.cpp", [
          "struct Target {                       // 基类：抽象的「目标」",
          "    virtual void draw() = 0;          // 纯虚函数 → 本类不能实例化",
          "    virtual ~Target() = default;      // 虚析构！见下",
          "};",
          "",
          "struct ArmorTarget : Target {        // 装甲板是一种 Target",
          "    void draw() override { /* 画装甲板 */ }",
          "};",
          "struct RuneTarget : Target {         // 能量机关也是一种 Target",
          "    void draw() override { /* 画大符 */ }",
          "};",
          "",
          "// 多态：同一个容器装不同类型，调用时各干各的",
          "std::vector<std::unique_ptr<Target>> targets;",
          "targets.push_back(std::make_unique<ArmorTarget>());",
          "targets.push_back(std::make_unique<RuneTarget>());",
          "for (auto &t : targets) t->draw();    // 运行时决定调谁的 draw"
        ].join("\n")),
        H.note("pitfall", "虚析构事故", "基类析构不写 virtual：<code class='inline'>delete 基类指针</code> 只调基类析构，派生类的资源全漏。<b>凡是准备被继承的类，析构一律 virtual</b>。这条记不住，代码上线就是泄漏。"),
        H.pracRef("cpp-p4"),
      ]},
      { id: "cpp-smartptr", title: "第 9 章 智能指针：内存管理的自动挡 ★★★", blocks: [
        H.sub("unique_ptr：独占所有权（默认选择）"),
        H.code("cpp", "unique_ptr.cpp", [
          "#include <memory>",
          "",
          "// 创建：make_unique 最安全（C++14）",
          "auto dev = std::make_unique<SerialDevice>(\"ttyUSB0\");",
          "dev->send(\"hello\");              // 像 raw pointer 一样用",
          "",
          "// 不能拷贝（所有权唯一）",
          "// auto d2 = dev;                // 编译错！",
          "auto d2 = std::move(dev);          // 只能移交：移交后 dev 变 nullptr",
          "",
          "// 出作用域自动 delete —— 忘掉 delete 这个动作"
        ].join("\n")),
        H.sub("shared_ptr：共享所有权（引用计数）"),
        H.code("cpp", "shared_ptr.cpp", [
          "auto node = std::make_shared<rclcpp::Node>(\"my_node\");   // ROS 2 标配",
          "",
          "auto n2 = node;                    // 拷贝：引用计数 +1",
          "// 最后一个 shared_ptr 死亡时，对象自动销毁",
          "// 代价：计数器原子操作有开销 + 控制块额外内存",
          "",
          "// 陷阱：循环引用（A 持有 B，B 持有 A）→ 计数永远不归零 → 泄漏",
          "// 破法：环上的一边用 weak_ptr（只观察不拥有）"
        ].join("\n")),
        H.table("智能指针选型表", ["场景", "用什么"], [
          ["对象只有一个主人（99% 场景）", "unique_ptr"],
          ["多方共享（如 ROS 2 节点句柄）", "shared_ptr"],
          ["观察但不拥有（缓存、回调引用）", "weak_ptr"],
          ["数组", "unique_ptr&lt;T[]&gt;（或直接 vector）"]
        ]),
        H.note("master", "师父的规矩", "从今天起，你的 C++ 代码里出现裸 <code class='inline'>new</code> 都需要理由——「为什么这里不能用 make_unique/make_shared？」。答不上来就改。视觉组开源代码评审第一条就查这个。"),
        H.pracRef("cpp-p5"),
      ]},
    ]},

    { id: "stage-cpp-4", title: "第四阶段 · 泛型与并发（进阶火力）", chapters: [
      { id: "cpp-template", title: "第 10 章 模板：类型的占位符", blocks: [
        H.sub("函数模板"),
        H.code("cpp", "template.cpp", [
          "// C 里只能用宏：#define MAX(a,b) ((a)>(b)?(a):(b)) —— 无类型检查、双求值坑",
          "template <typename T>",
          "T my_max(T a, T b) {",
          "    return a > b ? a : b;",
          "}",
          "",
          "int    a = my_max(3, 5);          // T = int（编译器推导）",
          "float  b = my_max(1.5f, 2.5f);    // T = float",
          "// 比宏强：类型检查、只求值一次、可调试"
        ].join("\n")),
        H.sub("类模板：容器就是这么造的"),
        H.code("cpp", "class_template.cpp", [
          "template <typename T, int N>",
          "class RunningFilter {                 // 滑动窗口滤波器",
          "public:",
          "    void push(T v) {",
          "        buf_[idx_] = v;",
          "        idx_ = (idx_ + 1) % N;",
          "    }",
          "    T average() const {",
          "        T sum{};",
          "        for (T v : buf_) sum += v;",
          "        return sum / N;",
          "    }",
          "private:",
          "    T buf_[N]{};",
          "    int idx_ = 0;",
          "};",
          "",
          "RunningFilter<float, 8> temp_filter;   // 8 点均值滤波"
        ].join("\n")),
        H.p("模板在编译期「实例化」出具体代码——<code class='inline'>vector&lt;int&gt;</code> 和 <code class='inline'>vector&lt;Armor&gt;</code> 是两个独立的类。所以模板要写在头文件里（编译器必须看到完整定义才能生成代码）。"),
        H.pracRef("cpp-p8"),
      ]},
      { id: "cpp-lambda", title: "第 11 章 lambda：匿名函数 ★★★", blocks: [
        H.sub("解剖一只 lambda"),
        H.code("cpp", "lambda.cpp", [
          "// [捕获](参数) -> 返回类型 { 函数体 }",
          "int base = 100;",
          "",
          "auto add = [base](int x) { return base + x; };   // 按值捕获 base（拍照）",
          "auto add2 = [&base](int x) { return base + x; }; // 按引用捕获（直播）",
          "",
          "auto add3 = [=](int x) { return base + x; };     // = 全部按值",
          "auto add4 = [&](int x) { return base + x; };     // & 全部按引用",
          "",
          "std::cout << add(1) << add2(1);   // 101 101（base 还没变时）"
        ].join("\n")),
        H.sub("实战：回调与排序比较器"),
        H.code("cpp", "lambda_sort.cpp", [
          "#include <algorithm>",
          "#include <vector>",
          "",
          "std::vector<Armor> armors = /* 检测结果 */;",
          "",
          "// 按「是否近 + 面积大」排序：lambda 比较器",
          "std::sort(armors.begin(), armors.end(),",
          "          [](const Armor &a, const Armor &b) {",
          "              if (a.dist != b.dist) return a.dist < b.dist;",
          "              return a.area > b.area;",
          "          });",
          "",
          "// ROS 2 回调：捕获 this 用成员",
          "sub_ = create_subscription<Msg>(\"topic\", 10,",
          "    [this](Msg::SharedPtr m) { handle(m); });   // 捕获 this 才能访问成员"
        ].join("\n")),
        H.note("pitfall", "悬垂引用", "按引用捕获局部变量后，把 lambda 存起来异步执行——函数早就返回了，引用的目标已死。<b>异步/存储的 lambda 只按值捕获</b>（或智能指针延长生命周期）。"),
        H.pracRef("cpp-p6"),
      ]},
      { id: "cpp-stl-algo", title: "第 12 章 STL 算法：别手写循环了", blocks: [
        H.code("cpp", "stl_algo.cpp", [
          "#include <algorithm>",
          "#include <numeric>",
          "#include <vector>",
          "",
          "std::vector<float> errs{0.5f, -1.2f, 0.3f, 2.0f};",
          "",
          "// 找最值",
          "auto biggest = *std::max_element(errs.begin(), errs.end());",
          "auto smallest = *std::min_element(errs.begin(), errs.end());",
          "",
          "// 求和（代替手写 for）",
          "float total = std::accumulate(errs.begin(), errs.end(), 0.f);",
          "",
          "// 计数",
          "size_t big = std::count_if(errs.begin(), errs.end(),",
          "                            [](float e) { return e > 1.f; });",
          "",
          "// 查找",
          "auto it = std::find_if(errs.begin(), errs.end(),",
          "                       [](float e) { return e < -1.f; });",
          "",
          "// 排序 + 去重",
          "std::sort(errs.begin(), errs.end());",
          "errs.erase(std::unique(errs.begin(), errs.end()), errs.end());",
          "",
          "// for_each：对每个元素执行操作",
          "std::for_each(errs.begin(), errs.end(),",
          "              [](float e) { std::cout << e << \"\\n\"; });"
        ].join("\n")),
        H.note("master", "心法", "看到自己写的循环，先问一句：<b>「STL 有没有现成的？」</b> max/min/count/find/sort/accumulate 覆盖了 80% 的日常循环。代码量减半，bug 率也减半。"),
        H.pracRef("cpp-p7"),
      ]},
      { id: "cpp-threads", title: "第 13 章 多线程：std::thread 与锁", blocks: [
        H.sub("视觉组的经典架构：采集线程 + 处理线程"),
        H.code("cpp", "threads.cpp", [
          "#include <thread>",
          "#include <mutex>",
          "#include <atomic>",
          "#include <queue>",
          "",
          "std::queue<cv::Mat> frame_queue;",
          "std::mutex q_mtx;",
          "std::atomic<bool> running{true};",
          "",
          "// 采集线程：相机回调里只管入队",
          "void capture_thread() {",
          "    while (running) {",
          "        cv::Mat frame = camera.read();",
          "        {",
          "            std::lock_guard<std::mutex> lk(q_mtx);",
          "            frame_queue.push(frame);",
          "        }",
          "    }",
          "}",
          "",
          "// 处理线程：出队处理",
          "void process_thread() {",
          "    while (running) {",
          "        cv::Mat frame;",
          "        {",
          "            std::lock_guard<std::mutex> lk(q_mtx);",
          "            if (frame_queue.empty()) continue;",
          "            frame = frame_queue.front();",
          "            frame_queue.pop();",
          "        }",
          "        process(frame);      // 注意：锁外做重活！",
          "    }",
          "}",
          "",
          "std::thread t1(capture_thread), t2(process_thread);",
          "// ... ",
          "t1.join(); t2.join();      // 等线程结束（别忘记，否则 terminate）"
        ].join("\n")),
        H.table("并发工具速查", ["工具", "用途"], [
          ["std::thread", "裸线程"],
          ["std::mutex + lock_guard", "保护共享数据（lock_guard 自动解锁）"],
          ["std::atomic&lt;T&gt;", "无锁的简单标志/计数器"],
          ["std::condition_variable", "线程间「等通知」（生产者消费者）"],
          ["std::async / future", "异步任务拿返回值"]
        ]),
        H.note("pitfall", "死锁四要素速查", "两个线程互相等对方的锁就死锁。预防：<b>① 所有线程按相同顺序加锁；② 锁粒度最小化；③ 用 std::scoped_lock 同时锁多个</b>。视觉组最常见事故：图像回调里加锁 A，处理线程持锁 B 又要 A。"),
        H.pracRef("cpp-p9"),
      ]},
      { id: "cpp-modern", title: "第 14 章 现代 C++ 常用语法糖", blocks: [
        H.code("cpp", "modern.cpp", [
          "// 结构化绑定（C++17）：一眼看清成员",
          "std::map<int, Armor> targets;",
          "for (auto &[id, armor] : targets) {",
          "    std::cout << id << armor.area;",
          "}",
          "",
          "// optional：表示「可能没有」（代替魔数 -1 或 bool+out 参数）",
          "#include <optional>",
          "std::optional<Armor> find_best(const std::vector<Armor> &v);",
          "if (auto best = find_best(armors)) {",
          "    best->area;               // 有值才进来",
          "}",
          "",
          "// enum class：带作用域的枚举（不会隐式转 int）",
          "enum class RobotState { Idle, Running, Fault };",
          "RobotState st = RobotState::Idle;",
          "// if (st == 0) {}           // 编译错：类型安全",
          "",
          "// constexpr：编译期常量（代替宏）",
          "constexpr float PI = 3.14159265f;",
          "constexpr int kMaxArmor = 12;"
        ].join("\n")),
        H.sub("C++ 类型转换四兄弟"),
        H.table("cast 速查", ["cast", "用途", "频率"], [
          ["static_cast", "数值转换、相关类型（void*↔T*）", "日常"],
          ["dynamic_cast", "多态类型安全下转（失败返回 nullptr）", "偶尔"],
          ["const_cast", "去 const（几乎不用）", "罕见"],
          ["reinterpret_cast", "位重解释（危险，只在做协议解析时用）", "罕见"]
        ]),
        H.note("warn", "别用 C 风格 cast", "<code class='inline'>(int)x</code> 会静默尝试所有 cast 里最危险的那种。搜索框里敲 「(\」 查 C 风格强转，一个一个换成具名 cast。"),
        H.pracRef("cpp-p11"),
      ]},
      { id: "cpp-rmstyle", title: "第 15 章 写一个工业风的 C++ 模块", blocks: [
        H.sub("装甲板检测器：综合演练"),
        H.code("cpp", "armor_detector.h", [
          "#pragma once",
          "#include <vector>",
          "#include <opencv2/opencv.hpp>",
          "#include <optional>",
          "",
          "namespace rm_vision {",
          "",
          "struct Armor {",
          "    cv::Point2f center;",
          "    float area = 0.f;",
          "    float dist = 0.f;",
          "};",
          "",
          "class ArmorDetector {",
          "public:",
          "    struct Params {",
          "        int hsv_low_h = 90, hsv_high_h = 120;",
          "        float min_light_area = 5.f;",
          "        float max_pair_dist_ratio = 3.2f;",
          "    };",
          "",
          "    explicit ArmorDetector(const Params &p) : params_(p) {}",
          "",
          "    // 检测一帧，返回按优先级排序的装甲板（可能为空）",
          "    std::vector<Armor> detect(const cv::Mat &bgr);",
          "",
          "private:",
          "    cv::Mat preprocess(const cv::Mat &bgr);",
          "    std::vector<Armor> match_pairs(const std::vector<cv::RotatedRect> &lights);",
          "",
          "    Params params_;",
          "};",
          "",
          "}  // namespace rm_vision"
        ].join("\n")),
        H.code("cpp", "armor_detector.cpp", [
          "#include \"armor_detector.h\"",
          "#include <algorithm>",
          "",
          "namespace rm_vision {",
          "",
          "std::vector<Armor> ArmorDetector::detect(const cv::Mat &bgr) {",
          "    cv::Mat mask = preprocess(bgr);",
          "",
          "    std::vector<std::vector<cv::Point>> contours;",
          "    cv::findContours(mask, contours,",
          "                     cv::RETR_EXTERNAL, cv::CHAIN_APPROX_SIMPLE);",
          "",
          "    std::vector<cv::RotatedRect> lights;",
          "    for (auto &c : contours) {",
          "        float area = (float)cv::contourArea(c);",
          "        if (area < params_.min_light_area) continue;    // 初筛",
          "        lights.emplace_back(cv::minAreaRect(c));",
          "    }",
          "",
          "    auto armors = match_pairs(lights);",
          "",
          "    // 排序：面积大者优先（打近的大的）",
          "    std::sort(armors.begin(), armors.end(),",
          "              [](const Armor &a, const Armor &b) {",
          "                  return a.area > b.area;",
          "              });",
          "    return armors;                    // NRVO：不拷贝",
          "}",
          "",
          "cv::Mat ArmorDetector::preprocess(const cv::Mat &bgr) {",
          "    cv::Mat hsv, mask;",
          "    cv::cvtColor(bgr, hsv, cv::COLOR_BGR2HSV);",
          "    cv::inRange(hsv,",
          "                cv::Scalar(params_.hsv_low_h, 80, 80),",
          "                cv::Scalar(params_.hsv_high_h, 255, 255),",
          "                mask);",
          "    return mask;",
          "}",
          "",
          "std::vector<Armor> ArmorDetector::match_pairs(",
          "        const std::vector<cv::RotatedRect> &lights) {",
          "    std::vector<Armor> out;",
          "    for (size_t i = 0; i < lights.size(); i++) {",
          "        for (size_t j = i + 1; j < lights.size(); j++) {",
          "            const auto &L = lights[i];",
          "            const auto &R = lights[j];",
          "            if (L.center.x >= R.center.x) continue;    // 保证左右",
          "            float dist = (float)cv::norm(L.center - R.center);",
          "            float ref = (L.size.height + R.size.height) * 0.5f;",
          "            if (dist / ref > params_.max_pair_dist_ratio) continue;",
          "            Armor a;",
          "            a.center = (L.center + R.center) * 0.5f;",
          "            a.area = dist * ref;",
          "            out.push_back(a);",
          "        }",
          "    }",
          "    return out;",
          "}",
          "",
          "}  // namespace rm_vision"
        ].join("\n")),
        H.note("master", "结课检查", "这个模块你现在的水平应该<b>每一行都能讲出为什么</b>：为什么参数聚成 Params 结构、为什么 private 藏实现、为什么传 const 引用、为什么用 sort+lambda、为什么 NRVO 不拷贝。讲不出来的那行，回到对应章节。什么时候能默写出这个模块，C++ 就出师了。"),
        H.pracRef("cpp-p14"),
      ]},
    ]},
  ]
};
