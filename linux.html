[Service]
Type=simple
User=robot                       # 低权限专用账号，崩了不伤系统
WorkingDirectory=/opt/rm
ExecStart=/opt/rm/vision_node --config /opt/rm/config.yaml
Restart=always                   # 崩溃必拉起
RestartSec=3                     # 崩后等 3 秒（防疯狂重启循环）

WantedBy=multi-user.target
