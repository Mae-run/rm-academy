    STATE_IDLE,
    STATE_RUNNING,
    STATE_ERROR
} SysState;

void state_loop(SysState *st, int event) {
    switch (*st) {
    case STATE_IDLE:
        if (event == 1) *st = STATE_RUNNING;
        break;
    case STATE_RUNNING:
        if (event == 2) *st = STATE_ERROR;
        break;
    case STATE_ERROR:
        if (event == 0) *st = STATE_IDLE;
        break;
    default:            /* 兜底：永远要有 default */
        *st = STATE_IDLE;
        break;
    }
}`),

    int *buf = malloc(1024);
    FILE *f  = fopen("data.txt", "r");
    if (!buf) return -1;
    if (!f)  { free(buf); return -2; }        /* 每个错误都要手动清一遍，烦 */
    if (process(f, buf) != 0) { free(buf); fclose(f); return -3; }  /* 更烦 */
    free(buf); fclose(f);
    return 0;
}

/* goto 版本：错误统一出口，清爽不漏 */
int do_something_v2(void) {
    int ret = 0;
    int *buf = malloc(1024);
    FILE *f  = NULL;
    if (!buf) { ret = -1; goto out; }
    f = fopen("data.txt", "r");
    if (!f)   { ret = -2; goto out; }
    if (process(f, buf) != 0) { ret = -3; goto out; }
out:
    free(buf);        /* free(NULL) 是安全的，放心统一调 */
    if (f) fclose(f);
    return ret;
}`),

        H.sub("机器人实战：解析裁判系统/遥控器数据帧"),
        H.code("c", "parse_cmd.c", `#include <stdio.h>
#include <string.h>

/* 收到一行命令 "CH1:1024;CH2:512" ，解析出通道值 */
int parse_channels(const char *line, int *ch1, int *ch2) {
    const char *p = line;
    char key[8]; int val; int n;

    int got1 = 0, got2 = 0;
    while (sscanf(p, "%7[^:]:%d%n", key, &val, &n) == 2) {
        if      (strcmp(key, "CH1") == 0) { *ch1 = val; got1 = 1; }
        else if (strcmp(key, "CH2") == 0) { *ch2 = val; got2 = 1; }
        p += n;
        if (*p == ';') p++;      /* 跳过分隔符 */
        else break;
    }
    return got1 && got2;         /* 两个都拿到才算成功 */
}`),

        H.note("master", "师父的话", "接下来三章是整个 C 语言的珠穆朗玛。不怕慢，就怕站。建议准备草稿纸，每一段代码都画出内存图——变量画成格子，指针画成箭头。画得出来就是懂了，画不出来就是没懂。"),

        H.p("<b>指针就是存「内存地址」的变量。</b> 每个变量住在内存里，门牌号就是地址；指针变量里存的就是这个门牌号。"),
        H.code("c", "pointer_basics.c", `int age = 20;
int *p = &age;      /* & 取地址：p 里存的是 age 的门牌号 */

/* 读法（从右往左念）：
 * int *p  →  "p 是一个指针，指向 int" 
 * *p      →  "顺着 p 里的地址找过去，取那个格子的值"（解引用）
 * &age    →  "取 age 的地址"
 */

printf("%d\\n",  age);   /* 20   直接读 */
printf("%d\\n", *p);     /* 20   沿地址找过去读 —— 同一个格子 */
printf("%p\\n", (void*)p); /* age 的地址，比如 0x7ffd... */

*p = 99;                 /* 沿地址找过去写 */
printf("%d\\n", age);    /* 99   age 被改了 */`),
        H.sub("两张图，胜过千言"),
        H.code("text", "内存图", `    内存地址      变量名     值
   ┌─────────┐
   │ 0x1000  │  age    │  20  │←──┐
   ├─────────┼─────────┼─────┤   │
   │ 0x2000  │  p      │0x1000│───┘  p 里存的是 age 的地址
   └─────────┴─────────┴─────┘

*p 的意思是：拿出 p 的值(0x1000)当地址，去那个地址读写。`),
        H.p("所以 <code class='inline'>*p = 99</code> 实际是「往 0x1000 号格子写 99」，而 0x1000 正是 age 的家。这就是函数能改外部变量的原理。"),
        H.sub("野指针：C 程序员的头号噩梦"),
        H.code("c", "wild_pointer.c", `int *p1;              /* 未初始化：内容是随机垃圾，指向随机地址 */
/* *p1 = 10; */        /* 💥 未定义行为：往随机地址写数据，可能崩可能更糟 */

int *p2 = NULL;        /* 好习惯：暂时没有目标就先设 NULL */
if (p2 != NULL) {      /* 用之前先判空 */
    *p2 = 10;
}

int *p3 = NULL;
/* *p3 = 10; */        /* 💥 解引用 NULL 也会崩（段错误），但这是"好的崩"：
                        /* 立刻死在现场，比悄悄写坏内存好查一万倍 */`),

        H.sub("指针的函数实战：经典的 swap"),
        H.code("c", "swap.c", `void swap(int *a, int *b) {
    int tmp = *a;      /* 3. 顺着 a 的地址取值存 tmp */
    *a = *b;           /* 4. 把 b 指向的值写进 a 指向的格子 */
    *b = tmp;          /* 5. tmp 写进 b 指向的格子 */
}

int main(void) {
    int x = 1, y = 2;
    swap(&x, &y);      /* 1. 传 x、y 的地址 */ 
    printf("%d %d\\n", x, y);   /* 2 1 */
}`),

void pid_init(Pid *p, float kp, float ki, float kd,
              float out_limit, float integ_limit) {
    /* 参数检查：工业代码的第一行永远是防御 */
    if (!p) return;
    p->kp = kp; p->ki = ki; p->kd = kd;
    p->integ = 0.0f; p->prev_err = 0.0f;
    p->out_limit = out_limit;
    p->integ_limit = integ_limit;
}

float pid_calc(Pid *p, float target, float feedback) {
    if (!p) return 0.0f;

    float err = target - feedback;

    /* 积分限幅（抗积分饱和） */
    p->integ += err;
    if (p->integ >  p->integ_limit) p->integ =  p->integ_limit;
    if (p->integ < -p->integ_limit) p->integ = -p->integ_limit;

    float deriv = err - p->prev_err;
    p->prev_err = err;

    float out = p->kp * err + p->ki * p->integ + p->kd * deriv;

    /* 输出限幅 */
    if (out >  p->out_limit) out =  p->out_limit;
    if (out < -p->out_limit) out = -p->out_limit;
    return out;
}`),
