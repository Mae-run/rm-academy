          "│ 解算节点  │ ←────────── │ 预测节点  │ ────────→  │ 电控通信  │ ──→ C 板",
          "└──────────┘  (订阅)     └──────────┘  (话题/串口) └──────────┘"

      { id: "ros2-setup", title: "第 2 章 环境搭建（Ubuntu 22.04 + Humble）", blocks: [

      { id: "ros2-concepts", title: "第 3 章 核心概念：节点 / 话题 / 服务 / 参数", blocks: [

        H.p("节点 = 机器人系统里的一个「器官」（相机、检测器、控制器各是一个节点）。每个节点有唯一名字，独立启动、独立崩溃、互不影响。"),
        H.sub("话题 Topic：单向广播（最常用）★★★"),
        H.code("text", "话题模型", [

      { id: "ros2-first-node", title: "第 4 章 第一个节点：发布者 + 订阅者 ★★★", blocks: [
        H.sub("发布者（rclcpp）"),
        H.code("cpp", "minimal_publisher.cpp", [
          "#include <rclcpp/rclcpp.hpp>",
          "#include <std_msgs/msg/string.hpp>",
          "",
          "class MinimalPublisher : public rclcpp::Node {",
          "public:",
          "    MinimalPublisher() : Node(\"minimal_publisher\"), count_(0) {",
          "        // ① 创建发布者：话题名 + 队列深度",
          "        pub_ = create_publisher<std_msgs::msg::String>(\"chatter\", 10);",
          "",
          "        // ② 定时器驱动发布（500ms 一次）",
          "        timer_ = create_wall_timer(",
          "            std::chrono::milliseconds(500),",
          "            [this]() {",
          "                auto msg = std_msgs::msg::String();",
          "                msg.data = \"hello \" + std::to_string(count_++);",
          "                pub_->publish(msg);",
          "            });",
          "    }",
          "private:",
          "    size_t count_;",
          "    rclcpp::Publisher<std_msgs::msg::String>::SharedPtr pub_;   // 智能指针持有",
          "    rclcpp::TimerBase::SharedPtr timer_;",
          "};",
          "",
          "int main(int argc, char *argv[]) {",
          "    rclcpp::init(argc, argv);",
          "    rclcpp::spin(std::make_shared<MinimalPublisher>());   // 事件循环",
          "    rclcpp::shutdown();",
          "    return 0;",
          "}"
        ].join("\n")),
        H.sub("订阅者（回调用 lambda）"),
        H.code("cpp", "minimal_subscriber.cpp", [
          "#include <rclcpp/rclcpp.hpp>",
          "#include <std_msgs/msg/string.hpp>",
          "",
          "class MinimalSubscriber : public rclcpp::Node {",
          "public:",
          "    MinimalSubscriber() : Node(\"minimal_subscriber\") {",
          "        sub_ = create_subscription<std_msgs::msg::String>(",
          "            \"chatter\", 10,",
          "            [this](const std_msgs::msg::String::SharedPtr msg) {",
          "                RCLCPP_INFO(get_logger(), \"heard: %s\", msg->data.c_str());",
          "            });",
          "    }",
          "private:",
          "    rclcpp::Subscription<std_msgs::msg::String>::SharedPtr sub_;",
          "};"
        ].join("\n")),
        H.sub("命令行验证三件套"),
        H.code("bash", "verify", [
          "# 终端 1：跑发布者",
          "ros2 run rm_vision minimal_publisher",
          "",
          "# 终端 2：偷听话题（最常用的调试手段）",
          "ros2 topic echo /chatter",
          "",
          "# 终端 3：看话题清单和详情",
          "ros2 topic list",
          "ros2 topic info /chatter          # 发布者/订阅者数量",
          "ros2 topic hz /image_raw          # 频率（查相机掉帧必备！）"
        ].join("\n")),
        H.note("master", "三个习惯", "① 节点成员（发布者/订阅者/定时器）一律 SharedPtr 成员——否则被销毁通信就断；② 回调里别做重活（>10ms 就该丢队列或开线程）；③ <code class='inline'>ros2 topic hz</code> 和 <code class='inline'>echo</code> 是你的听诊器，每天都要用。"),
        H.pracRef("ros-p1"),
        H.pracRef("ros-p2"),
      ]},
    ]},

    { id: "stage-ros-2", title: "第二阶段 · 消息与通信进阶", chapters: [
      { id: "ros2-msg", title: "第 5 章 消息类型与自定义 msg ★★★", blocks: [
        H.sub("常用内置消息"),
        H.table("常用消息类型", ["类型", "字段", "RM 场景"], [
          ["std_msgs/String", "data", "调试消息"],
          ["std_msgs/Header", "stamp + frame_id", "时间戳与坐标系（几乎所有消息都有）"],
          ["sensor_msgs/Image", "Header + height/width/encoding + data[]", "相机图像"],
          ["sensor_msgs/Imu", "角速度/线加速度/姿态", "IMU 数据"],
          ["geometry_msgs/Point", "x, y, z", "目标位置"],

        H.code("text", "Detection.msg", [

        H.pracRef("ros-p3"),
      ]},
      { id: "ros2-topic", title: "第 6 章 话题进阶：QoS 与时间戳", blocks: [
        H.sub("QoS：通信质量的三要素"),
        H.code("cpp", "qos.cpp", [
          "rclcpp::QoS qos(10);                       // 队列深度",
          "qos.reliability(RMW_QOS_POLICY_RELIABILITY_BEST_EFFORT);   // 尽力而为",
          "qos.durability(RMW_QOS_POLICY_DURABILITY_VOLATILE);",
          "",
          "auto sub = create_subscription<Image>(\"image_raw\", qos, cb);",
          "",
          "/* 图像流为什么用 BEST_EFFORT？",
          " * RELIABLE 会重传丢包 → 旧帧堆积 → 处理延迟越滚越大",
          " * 图像丢了就丢了，我们要的是「最新」，不是「完整」 */"
        ].join("\n")),
        H.table("QoS 速查", ["设置", "含义", "场景"], [
          ["RELIABLE", "可靠传输（重传）", "指令、参数、低频关键数据"],
          ["BEST_EFFORT", "尽力而为（可丢）", "<b>图像流</b>、高频传感器"],
          ["队列深度", "积压多少条", "小队列 = 及时丢弃旧数据"]
        ]),
        H.sub("时间戳：数据同步的命脉"),
        H.code("cpp", "timestamp.cpp", [
          "auto msg = std::make_shared<PointStamped>();",
          "msg->header.stamp = this->now();        // 打时间戳",
          "msg->header.frame_id = \"camera\";      // 打坐标系",
          "",
          "/* 为什么重要：",
          " * ① 融合 IMU 和图像时，两帧数据要对齐时间戳（差 10ms 弹道就歪了）",
          " * ② TF 查询按时间插值，没戳的数据没法变换",
          " * ③ 回放 bag 时用 --clock，节点要用 header.stamp 而不是墙上时钟 */"
        ].join("\n")),
        H.note("warn", "相机的坑", "相机驱动节点要把<b>曝光时刻</b>的时间戳打进 header.stamp，而不是「处理完才打」。RM 视觉精度命门之一——慢 10ms，3m 外差 3cm，直接脱靶。"),
      ]},
      { id: "ros2-service", title: "第 7 章 服务与参数实战", blocks: [
        H.sub("服务端与客户端"),
        H.code("cpp", "service.cpp", [
          "#include <example_interfaces/srv/add_two_ints.hpp>",
          "",
          "class AddServer : public rclcpp::Node {",
          "public:",
          "    AddServer() : Node(\"add_server\") {",
          "        srv_ = create_service<example_interfaces::srv::AddTwoInts>(",
          "            \"add_two_ints\",",
          "            [this](const std::shared_ptr<Request> req,",
          "                   std::shared_ptr<Response> res) {",
          "                res->sum = req->a + req->b;",
          "            });",
          "    }",
          "private:",
          "    rclcpp::Service<example_interfaces::srv::AddTwoInts>::SharedPtr srv_;",
          "};"
        ].join("\n")),
        H.code("bash", "service_cli", [
          "# 命令行直接调服务（调试神器）",
          "ros2 service list",
          "ros2 service call /add_two_ints example_interfaces/srv/AddTwoInts",
          "  \"{a: 3, b: 5}\""
        ].join("\n")),
        H.sub("参数：声明 → 读取 → 覆盖"),
        H.code("cpp", "params.cpp", [
          "class DetectorNode : public rclcpp::Node {",
          "public:",
          "    DetectorNode() : Node(\"detector_node\") {",
          "        // 声明（带默认值）",
          "        declare_parameter<int>(\"hsv_low_h\", 90);",
          "        declare_parameter<int>(\"hsv_high_h\", 120);",
          "        declare_parameter<double>(\"max_dist\", 8.0);",
          "",
          "        // 读取",
          "        hsv_low_  = get_parameter(\"hsv_low_h\").get_value<int>();",
          "        hsv_high_ = get_parameter(\"hsv_high_h\").get_value<int>();",
          "",
          "        // 动态参数回调（运行中改，立即生效）",
          "        param_cb_ = add_on_set_parameters_callback(",
          "            [this](const std::vector<rclcpp::Parameter> &params) {",
          "                for (auto &p : params) {",
          "                    if (p.get_name() == \"hsv_low_h\")",
          "                        hsv_low_ = p.get_value<int>();",
          "                }",
          "                rcl_interfaces::msg::SetParametersResult result;",
          "                result.successful = true;",
          "                return result;",
          "            });",
          "    }",
          "private:",
          "    int hsv_low_, hsv_high_;",
          "    rclcpp::node_interfaces::OnSetParametersCallbackHandle::SharedPtr param_cb_;",
          "};"
        ].join("\n")),
        H.code("bash", "params_cli", [
          "# 命令行覆盖参数",
          "ros2 run rm_vision detector_node --ros-args -p hsv_low_h:=80",
          "",

      { id: "ros2-tf", title: "第 8 章 TF2：坐标变换的图书馆 ★★★", blocks: [
        H.sub("TF 树：机器人的「骨架名册」"),
        H.code("text", "RM 机器人 TF 树", [
          "map                    (世界坐标)",
          " └── odom              (里程计)",
          "      └── base_link    (车体中心)",
          "           ├── camera_optical   (相机光学系)",
          "           └── gimbal           (云台)",
          "                └── gun          (枪管系)",
          "",
          "每个箭头 = 一个 3D 变换（平移 + 旋转），带时间戳",
          "任何两个 frame 之间的变换，TF2 自动沿树插值算出来"
        ].join("\n")),
        H.sub("发布与查询"),
        H.code("cpp", "tf_basics.cpp", [
          "// 静态变换（安装位置，一次发布永久有效）：命令行就能发",
          "// ros2 run tf2_ros static_transform_publisher \\",
          "//   0.1 0 0.2 0 0 0 base_link camera_optical",
          "",
          "// 动态变换（云台转动，持续发布）",
          "#include <tf2_ros/transform_broadcaster.h>",
          "",
          "geometry_msgs::msg::TransformStamped t;",
          "t.header.stamp = this->now();",
          "t.header.frame_id = \"base_link\";",
          "t.child_frame_id = \"gimbal\";",
          "t.transform.translation.z = 0.15;",
          "tf2::Quaternion q;",

      { id: "ros2-custom-msg", title: "第 11 章 综合实战：图像处理流水线", blocks: [
        H.p("把前面学的全部串起来：相机 → 检测 → 输出目标点。这是 RM 视觉的最小可运行骨架："),
        H.code("cpp", "pipeline_node.cpp", [
          "#include <rclcpp/rclcpp.hpp>",
          "#include <sensor_msgs/msg/image.hpp>",
          "#include <geometry_msgs/msg/point_stamped.hpp>",
          "#include <cv_bridge/cv_bridge.h>",
          "#include <opencv2/opencv.hpp>",
          "",
          "class PipelineNode : public rclcpp::Node {",
          "public:",
          "    PipelineNode() : Node(\"pipeline_node\") {",
          "        // 订阅原始图像：BEST_EFFORT（图像流可丢帧）",
          "        rclcpp::QoS img_qos(1);",
          "        img_qos.reliability(RMW_QOS_POLICY_RELIABILITY_BEST_EFFORT);",
          "",
          "        sub_ = create_subscription<sensor_msgs::msg::Image>(",
          "            \"image_raw\", img_qos,",
          "            [this](const sensor_msgs::msg::Image::SharedPtr msg) {",
          "                on_image(msg);",
          "            });",
          "",
          "        pub_ = create_publisher<geometry_msgs::msg::PointStamped>(",
          "            \"target\", 10);",
          "    }",
          "",
          "private:",
          "    void on_image(const sensor_msgs::msg::Image::SharedPtr msg) {",
          "        auto t0 = this->now();",
          "",
          "        // ① ROS 消息 → OpenCV 矩阵",
          "        cv::Mat img = cv_bridge::toCvCopy(msg, \"bgr8\")->image;",
          "",
          "        // ② 处理流水线",
          "        cv::Mat gray, binary;",
          "        cv::cvtColor(img, gray, cv::COLOR_BGR2GRAY);",
          "        cv::threshold(gray, binary, 100, 255, cv::THRESH_BINARY);",
          "        std::vector<std::vector<cv::Point>> contours;",
          "        cv::findContours(binary, contours,",
          "                         cv::RETR_EXTERNAL, cv::CHAIN_APPROX_SIMPLE);",
          "",
          "        // ③ 找最大轮廓 → 发目标点",
          "        if (!contours.empty()) {",
          "            auto biggest = *std::max_element(",
          "                contours.begin(), contours.end(),",
          "                [](auto &a, auto &b) {",
          "                    return cv::contourArea(a) < cv::contourArea(b);",
          "                });",
          "            auto m = cv::moments(biggest);",
          "            if (m.m00 > 100) {",
          "                geometry_msgs::msg::PointStamped pt;",
          "                pt.header = msg->header;        // 继承时间戳与坐标系",
          "                pt.point.x = m.m10 / m.m00;",
          "                pt.point.y = m.m01 / m.m00;",
          "                pub_->publish(pt);",
          "            }",
          "        }",
          "",
          "        // ④ 打点：处理耗时（性能监控从第一行代码开始）",
          "        RCLCPP_INFO_THROTTLE(get_logger(), *get_clock(), 1000,",
          "            \"pipeline: %.1f ms\",",
          "            (this->now() - t0).seconds() * 1000.0);",
          "    }",
          "",
          "    rclcpp::Subscription<sensor_msgs::msg::Image>::SharedPtr sub_;",
          "    rclcpp::Publisher<geometry_msgs::msg::PointStamped>::SharedPtr pub_;",
          "};"
        ].join("\n")),
        H.note("master", "这个骨架吃透了，ROS 2 就出师了", "重点检查你是否懂：QoS 为什么 BEST_EFFORT、header 为什么要继承、回调里耗时打点、RCLCPP_INFO_THROTTLE 节流日志、max_element + lambda 找最大轮廓。每个「为什么」都能答上，你就能独立写视觉节点了。"),
        H.pracRef("ros-p7"),
        H.pracRef("ros-p8"),
      ]},

          "",
          "// 多线程：回调可能并发执行 → 共享数据要加锁",

          "executor.spin();",
          "",
