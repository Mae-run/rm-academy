  传统法：HSV 的 V 通道饱和，inRange 阈值失效，装甲板在 mask 里消失

案例3 半遮挡装甲板：

          ["感受野", "一个输出点看得见原图多大范围", "深层感受野大 → 能判断整体是装甲板"],

特征图：每个位置的某种特征响应强度图

池化：降采样压缩分辨率

  坏了的现象：loss 不降 → lr 不当或标签有错
梯度下降：按错误方向微调所有权重

  1    —— batch size，一张图
  84   —— 4 (x,y,w,h 框坐标) + 80 (COCO 80 类的概率)
        RM 自训练后只有 2~3 类，变成 4+3=7 维
  8400 —— 三个尺度的网格点总数：

  同一个装甲板会被相邻多个网格点同时检出 → 5~10 个重叠框
  NMS 按置信度排序：保留最高的，删掉与它 IoU>0.5 的其余框

【场地采集】(最重要，占 60%)
  - 己方 + 对方机器人各角度静止摆拍：500 张
  - 云台慢转/快转动态抓帧：1000 张（视频抽帧）

【对抗场景】(决定比赛表现，占 25%)

  - 半遮挡（机器人互相挡）：300 张

【负样本】(防误检，占 15%)

  - 观众席、大屏幕、其他发光物体：200 张

总计约 4000~5000 张，比 1000 张精标强得多`),

          hint: "类别按颜色+大符分；框贴合到灯条外沿 2~3 像素；疑难样本标 hard；每 500 张交叉互查。",

一、类别定义（4 类）
  0 red_armor    己方可打击的红色装甲板
  1 blue_armor   己方可打击的蓝色装甲板
  2 base         基地装甲板（血量判定用）
  3 ignore       难以辨认的目标（训练时忽略不算错）

二、框的松紧
  - 框紧贴装甲板灯条外沿，外扩不超过 3 像素
  - 包含完整灯条，不含相邻结构
  - 模糊到人眼看不清的 → 标 ignore，不硬标

三、必须标全
  一张图里有几个标几个。漏标 = 教网络"这里没有目标"，
  是最严重的标注错误。标完做视野扫描自查（左上到右下）。

四、难度标签（可选，用于分析）
  easy   正面清晰
  medium 侧斜 30°~60° 或轻微遮挡
  hard   小陀螺斜姿态 / 重遮挡 / 运动模糊

五、交叉互查
  每 500 张换人复查一遍，重点查漏标和类别错。
  复查发现问题率 > 5% → 这批重标。`)
        }),

# rm_armor.yaml 内容：

          hint: "①查 lr 和标注质量 ②分辨率和锚框 ③负样本和增广强度。",
          solution: H.code("text", "troubleshoot.txt", `问题① loss 50 轮不降
  排查：
    1. lr 是不是默认 0.01 没调？→ 先 /10 试试
    2. 可视化 100 张标注图 → 查是否大面积漏标/类别错
    3. 打印前 3 轮 loss：如果第一轮就高且平 → 标签错了
  修复：lr=0.001 重训 + 重标问题批次

import numpy as np
import cv2

CLASSES = ["red_armor", "blue_armor"]
CONF_TH = 0.45
NMS_TH  = 0.5

def letterbox(img, size=640):
    h, w = img.shape[:2]
    scale = min(size / h, size / w)
    nh, nw = int(h * scale), int(w * scale)
    resized = cv2.resize(img, (nw, nh))
    canvas = np.full((size, size, 3), 114, dtype=np.uint8)
    top  = (size - nh) // 2
    left = (size - nw) // 2
    canvas[top:top+nh, left:left+nw] = resized
    return canvas, scale, left, top

def nms(boxes, scores, iou_th):
    keep = []
    order = scores.argsort()[::-1]
    while order.size > 0:
        i = order[0]
        keep.append(i)
        xx1 = np.maximum(boxes[i,0], boxes[order[1:],0])
        yy1 = np.maximum(boxes[i,1], boxes[order[1:],1])
        xx2 = np.minimum(boxes[i,2], boxes[order[1:],2])
        yy2 = np.minimum(boxes[i,3], boxes[order[1:],3])
        w = np.maximum(0, xx2 - xx1)
        h = np.maximum(0, yy2 - yy1)
        iou = (w * h) / ((boxes[i,2]-boxes[i,0])*(boxes[i,3]-boxes[i,1]) +
                         (boxes[order[1:],2]-boxes[order[1:],0])*(boxes[order[1:],3]-boxes[order[1:],1]) - w*h)
        order = order[iou <= iou_th]
    return keep

sess = ort.InferenceSession("best.onnx")
img = cv2.imread("field.jpg")
canvas, scale, dx, dy = letterbox(img)
blob = cv2.dnn.blobFromImage(canvas, 1/255.0, (640,640), swapRB=True)

out = sess.run(None, {"images": blob})[0]        # [1,84,8400]
out = out[0].T                                    # [8400,84]

boxes, scores, class_ids = [], [], []
for row in out:
    cls_score = row[4:].max()
    if cls_score < CONF_TH: continue
    cls_id = row[4:].argmax()
    cx, cy, w, h = row[:4]
    x1 = (cx - w/2 - dx) / scale
    y1 = (cy - h/2 - dy) / scale
    boxes.append([x1, y1, x1 + w/scale, y1 + h/scale])
    scores.append(cls_score)
    class_ids.append(cls_id)

    keep = nms(np.array(boxes), np.array(scores), NMS_TH)
    for i in keep:

        cv2.rectangle(img, (x1,y1), (x2,y2), (0,255,0), 2)
        cv2.putText(img, f"{CLASSES[class_ids[i]]} {scores[i]:.2f}",

cv2.imshow("YOLO", img)

#include <algorithm>

struct Det { float x1, y1, x2, y2, score; int cls; };

float iou(const Det& a, const Det& b) {
    float xx1 = std::max(a.x1, b.x1), yy1 = std::max(a.y1, b.y1);
    float xx2 = std::min(a.x2, b.x2), yy2 = std::min(a.y2, b.y2);
    float w = std::max(0.f, xx2 - xx1), h = std::max(0.f, yy2 - yy1);
    float inter = w * h;
    float uni = (a.x2-a.x1)*(a.y2-a.y1) + (b.x2-b.x1)*(b.y2-b.y1) - inter;
    return uni > 0 ? inter / uni : 0;
}

std::vector<Det> postprocess(const float* out, int num_pred,
                              float conf_th, float nms_th,
                              float scale, float dx, float dy) {
    std::vector<Det> dets;
    // 84 = 4 坐标 + 80 类；RM 场景改为 4 + num_cls
    const int num_cls = 2;
    const int stride  = 4 + num_cls;

    for (int i = 0; i < num_pred; ++i) {
        const float* row = out + i * stride;
        float best = row[4]; int cls = 0;
        for (int c = 1; c < num_cls; ++c)
            if (row[4 + c] > best) { best = row[4 + c]; cls = c; }
        if (best < conf_th) continue;

        float cx = row[0], cy = row[1], w = row[2], h = row[3];
        // letterbox 逆变换
        float x1 = (cx - w / 2 - dx) / scale;
        float y1 = (cy - h / 2 - dy) / scale;
        dets.push_back({x1, y1, x1 + w / scale, y1 + h / scale, best, cls});
    }

    // NMS（按分数贪心）
    std::sort(dets.begin(), dets.end(),
              [](const Det& a, const Det& b){ return a.score > b.score; });
    std::vector<Det> keep;
    for (size_t i = 0; i < dets.size(); ++i) {
        bool suppressed = false;
        for (size_t j = 0; j < keep.size(); ++j)
            if (iou(dets[i], keep[j]) > nms_th) { suppressed = true; break; }
        if (!suppressed) keep.push_back(dets[i]);
    }
    return keep;
}`)

传统跟踪：只用高置信度检测做匹配

流程：

class SimpleTracker:
    def __init__(self, iou_th=0.3, max_miss=3):
        self.iou_th = iou_th
        self.max_miss = max_miss
        self.tracks = []      # [{id, box, missed}]
        self.next_id = 1

    @staticmethod
    def iou(a, b):
        xx1, yy1 = max(a[0], b[0]), max(a[1], b[1])
        xx2, yy2 = min(a[2], b[2]), min(a[3], b[3])
        w, h = max(0, xx2-xx1), max(0, yy2-yy1)
        inter = w * h
        ua = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter
        return inter/ua if ua > 0 else 0

    def _match_round(self, tracks, dets):
        used_d, used_t = set(), set()
        pairs = []
        for ti, tr in enumerate(tracks):
            best_iou, best_di = self.iou_th, -1
            for di, d in enumerate(dets):
                if di in used_d: continue
                v = self.iou(tr["box"], d[:4])
                if v > best_iou: best_iou, best_di = v, di
            if best_di >= 0:
                used_d.add(best_di); used_t.add(ti)
                pairs.append((ti, best_di))
        return pairs, used_t, used_d

    def update(self, detections):
        # detections: [[x1,y1,x2,y2,score], ...]
        high = [d for d in detections if d[4] > 0.5]
        low  = [d for d in detections if 0.1 < d[4] <= 0.5]

        # 第一轮：全部轨迹 vs high
        pairs, used_t, _ = self._match_round(self.tracks, high)
        for ti, di in pairs:
            self.tracks[ti]["box"] = high[di][:4]
            self.tracks[ti]["missed"] = 0

        # 第二轮：剩下的轨迹 vs low
        rest = [t for i, t in enumerate(self.tracks) if i not in used_t]
        pairs2, used_t2, _ = self._match_round(rest, low)
        for ti, di in pairs2:
            rest[ti]["box"] = low[di][:4]
            rest[ti]["missed"] = 0

        # 未匹配轨迹 missed+1，超时删除
        matched_ids = {t["id"] for t in self.tracks
                       if t["missed"] == 0}
        for t in self.tracks:
            if t["id"] not in matched_ids:
                t["missed"] += 1
        self.tracks = [t for t in self.tracks if t["missed"] <= self.max_miss]

        # 未匹配的 high 检测 → 新轨迹
        matched_boxes = {tuple(t["box"]) for t in self.tracks if t["missed"] == 0}
        for d in high:
            if tuple(d[:4]) not in matched_boxes:
                self.tracks.append({"id": self.next_id, "box": d[:4], "missed": 0})
                self.next_id += 1

        return [(t["id"], t["box"]) for t in self.tracks]

# —— 3 帧模拟测试 ——

print("帧2:", tr.update(f2))   # ID 1 靠 low 组保住
print("帧3:", tr.update(f3))   # ID 1 恢复高分，ID 不变`)
