      { id: "rme-arch", title: "第 4 章 FreeRTOS 任务架构 ★★★", blocks: [

          "┌──────────────┬────────────────┬───────┬────────┬────────┐",

          "#include \"task.h\"",
          "",
          "void Ctrl_Task(void *arg) {",
          "    TickType_t last = xTaskGetTickCount();",
          "    const TickType_t period = pdMS_TO_TICKS(2);   /* 2ms 周期 */",
          "",
          "    ctrl_init();",
          "    for (;;) {                                     /* RTOS 任务永不返回 */",
          "        ctrl_update();                            /* 干活 */",
          "        vTaskDelayUntil(&last, period);           /* 精确周期调度 */",
          "    }",
          "}",
          "",
          "void tasks_create(void) {",
          "    xTaskCreate(Ctrl_Task,    \"ctrl\",    1024, NULL, 4, NULL);",

      { id: "rme-can", title: "第 5 章 CAN 通信 ★★★", blocks: [
        H.sub("CAN 是什么：一条两线广播总线"),
        H.p("多设备挂同一对差分线（CAN_H/CAN_L），按 ID 仲裁，11 位标准 ID。发出去所有人都听得到，各自按 ID 认领。RM 里：电机反馈 0x201~0x208、电调指令 0x200（电流）/0x1FF。"),
        H.sub("发送：电流指令打包"),
        H.code("c", "can_tx.c", [
          "/* 大疆电调协议：0x200 帧带 4 个电机的电流指令",
          " * 每电机 2 字节，高字节在前，int16 有符号 */",
          "#define CAN_ID_CURRENT_CMD  0x200",
          "",
          "void can_send_currents(int16_t cur[4]) {",
          "    uint8_t data[8];",
          "    for (int i = 0; i < 4; i++) {",
          "        data[i*2]   = (uint8_t)((cur[i] >> 8) & 0xFF);   /* 高字节 */",
          "        data[i*2+1] = (uint8_t)( cur[i]       & 0xFF);   /* 低字节 */",
          "    }",
          "    CAN_TxHeaderTypeDef tx = {",
          "        .StdId = CAN_ID_CURRENT_CMD,",
          "        .IDE   = CAN_ID_STD,",
          "        .RTR   = CAN_RTR_DATA,",
          "        .DLC   = 8,",
          "        .TransmitGlobalTime = DISABLE,",
          "    };",
          "    uint32_t mailbox;",
          "    HAL_CAN_AddTxMessage(&hcan1, &tx, data, &mailbox);",
          "}"
        ].join("\n")),
        H.sub("接收：中断 → 队列 → 任务"),
        H.code("c", "can_rx.c", [
          "/* 中断回调：只收数据进队列，不做解析（快进快出） */",
          "volatile uint8_t can_rx_data[8];",
          "volatile uint16_t can_rx_id;",
          "",
          "void HAL_CAN_RxFifo0MsgPendingCallback(CAN_HandleTypeDef *hcan) {",
          "    CAN_RxHeaderTypeDef rx;",
          "    if (HAL_CAN_GetRxMessage(hcan, CAN_RX_FIFO0, &rx,",
          "                             (uint8_t *)can_rx_data) == HAL_OK) {",
          "        can_rx_id = rx.StdId;",
          "        /* 置标志 / 写队列，让 CAN_Rx_Task 来解析 */",
          "        BaseType_t woken = pdFALSE;",
          "        xTaskNotifyFromISR(can_task_handle, 0, eNoAction, &woken);",
          "        portYIELD_FROM_ISR(woken);",
          "    }",
          "}",
          "",
          "/* 任务层：按 ID 分发解析 */",
          "void CAN_Rx_Task(void *arg) {",
          "    for (;;) {",
          "        ulTaskNotifyTake(pdTRUE, portMAX_DELAY);   /* 等中断通知 */",
          "        if (can_rx_id >= 0x205) {",
          "            /* 0x205~0x208: GM6020 云台电机 */",
          "            motor6020_decode(can_rx_id, can_rx_data);",
          "        } else {",
          "            /* 0x201~0x204: M3508 底盘电机 */",
          "            motor3508_decode(can_rx_id, can_rx_data);",
          "        }",
          "    }",
          "}"
        ].join("\n")),

        H.pracRef("rme-p1"),
      ]},
      { id: "rme-dji-motor", title: "第 6 章 大疆电机驱动与标定 ★★★", blocks: [
        H.sub("两种主力电机"),
        H.table("电机对比", ["型号", "用途", "反馈内容", "控制量"], [
          ["M3508 + C620 电调", "底盘", "机械角/转速/转矩电流/温度", "电流（-16384~16384 ↔ -20A~20A）"],
          ["GM6020", "云台", "机械角/转速/电流/温度", "电流（电压）"]
        ]),
        H.sub("M3508 反馈解码（位运算实战）"),
        H.code("c", "m3508.c", [
          "/* 反馈帧 8 字节：",
          " * data[0..1] 机械角度 0~8191 ↔ 0~360°",
          " * data[2..3] 转速 rpm（int16）",
          " * data[4..5] 转矩电流（int16）",
          " * data[6]   温度（℃）",
          " * data[7]   null */",
          "",
          "typedef struct {",
          "    uint16_t ecd;          /* 编码器原始值 0~8191 */",
          "    float    angle_deg;    /* 累计角度（处理过圈） */",
          "    float    speed_rpm;",
          "    float    current;",
          "    uint8_t  temp;",
          "    int      round_cnt;    /* 圈数计数 */",
          "    uint16_t last_ecd;     /* 过圈检测用 */",
          "} Motor3508;",
          "",
          "void m3508_decode(Motor3508 *m, const uint8_t d[8]) {",
          "    m->ecd       = (uint16_t)((d[0] << 8) | d[1]);",
          "    m->speed_rpm = (float)((int16_t)((d[2] << 8) | d[3]));",
          "    m->current   = (float)((int16_t)((d[4] << 8) | d[5]));",
          "    m->temp      = d[6];",
          "",
          "    /* 过圈处理：8191→0 跳变检测 */",
          "    int16_t diff = (int16_t)m->ecd - (int16_t)m->last_ecd;",
          "    if (diff >  4096) m->round_cnt--;   /* 正转过圈 */",
          "    if (diff < -4096) m->round_cnt++;   /* 反转过圈 */",
          "    m->last_ecd = m->ecd;",
          "    m->angle_deg = m->round_cnt * 360.f",
          "                 + (float)m->ecd * 360.f / 8191.f;",
          "}"
        ].join("\n")),
        H.sub("电流换算（重要常数）"),
        H.code("c", "current_convert.c", [
          "/* C620 电调：指令 16384 ↔ 20A，线性对应 */",
          "#define CMD_TO_AMP  (20.0f / 16384.0f)",
          "#define AMP_TO_CMD  (16384.0f / 20.0f)",
          "",
          "float cmd_to_amp(int16_t cmd) { return cmd * CMD_TO_AMP; }",
          "int16_t amp_to_cmd(float amp) {",
          "    float c = amp * AMP_TO_CMD;",
          "    if (c >  16384.f) c =  16384.f;    /* 限幅！ */",
          "    if (c < -16384.f) c = -16384.f;",
          "    return (int16_t)c;",
          "}"
        ].join("\n")),
        H.note("pitfall", "过圈跳变", "编码器 0~8191 循环，从 8190 转到 3 是「正向过圈」不是「倒转 8190」。过圈检测的 ±4096 阈值就是防这个。角度不处理过圈，PID 会周期性疯狂输出来回抽动——新队最常见的「机器人抽风」病因。"),
        H.pracRef("rme-p2"),
      ]},
    ]},

    { id: "stage-rme-3", title: "第三阶段 · 控制核心", chapters: [
      { id: "rme-pid", title: "第 7 章 PID 控制 ★★★（电控的心脏）", blocks: [
        H.sub("PID：误差的现在、过去、未来"),
        H.code("text", "PID 直觉", [
          "误差 e(t) = 目标 - 实际",
          "",
          "P（比例）: 现在差多少 → 立刻纠正   （主力，但有稳态误差）",
          "I（积分）: 过去累计差多少 → 慢慢补 （消除稳态误差，但会饱和）",
          "D（微分）: 误差变化多快 → 提前刹车 （抑制超调，但放大噪声）",
          "",
          "输出 = Kp·e + Ki·∫e·dt + Kd·de/dt"
        ].join("\n")),
        H.sub("工程级 PID：限幅 + 抗饱和"),
        H.code("c", "pid.c", [
          "typedef struct {",
          "    float kp, ki, kd;",
          "    float integ;           /* 积分累计 */",
          "    float prev_err;",
          "    float out_limit;       /* 输出限幅 */",
          "    float integ_limit;     /* 积分限幅（抗饱和） */",
          "} Pid;",
          "",
          "float pid_calc(Pid *p, float target, float feedback) {",
          "    if (!p) return 0.f;",
          "    float err = target - feedback;",
          "",
          "    /* 积分 + 限幅（抗积分饱和） */",
          "    p->integ += err;",
          "    if (p->integ >  p->integ_limit) p->integ =  p->integ_limit;",
          "    if (p->integ < -p->integ_limit) p->integ = -p->integ_limit;",
          "",
          "    float deriv = err - p->prev_err;",
          "    p->prev_err = err;",
          "",
          "    float out = p->kp * err + p->ki * p->integ + p->kd * deriv;",
          "",
          "    /* 输出限幅 */",
          "    if (out >  p->out_limit) out =  p->out_limit;",
          "    if (out < -p->out_limit) out = -p->out_limit;",
          "    return out;",
          "}"
        ].join("\n")),
        H.sub("底盘用什么环？云台用什么环？"),
        H.table("不同对象的控制策略", ["对象", "环结构", "理由"], [
          ["底盘 M3508（速度控制）", "速度 PI 单环", "速度环内含积分，稳态无差；位置环多余"],
          ["云台 GM6020（角度控制）", "角度外环 + 角速度内环（串级）", "内环吃掉扰动，外环管准度"],
          ["摩擦轮", "速度 PI", "恒转速打弹，速度环足够"],
          ["拨弹电机", "位置环（角度）", "精确控制每发转动角度"]
        ]),
        H.sub("串级 PID：云台的正确打开方式"),
        H.code("c", "cascade_pid.c", [
          "/* 外环：角度 → 输出目标角速度",
          " * 内环：角速度 → 输出电流 */",
          "float gimbal_control(Pid *angle_pid, Pid *speed_pid,",
          "                     float target_deg, float angle_deg,",
          "                     float gyro_dps) {",
          "    /* 外环：角度误差 → 期望角速度 */",
          "    float target_speed = pid_calc(angle_pid, target_deg, angle_deg);",
          "",

          "void attitude_update(Attitude *att, float gx, float gy, float gz,",
          "                     float ax, float ay, float az, float dt) {",
          "    /* ① 陀螺积分 */",
          "    att->roll  += gx * dt;      /* gx 单位 rad/s */",
          "    att->pitch += gy * dt;",
          "",
          "    /* ② 加速度计解静态姿态（当加速度≈0 时才可信，实际用阈值判断） */",

          "    float pitch_acc = atan2f(-ax, sqrtf(ay*ay + az*az));",

          "    /* ③ 融合 */",
          "    const float alpha = 0.98f;",
          "    att->roll  = alpha * att->roll  + (1-alpha) * roll_acc;",

          "}"
        ].join("\n")),

          "/* DBUS 帧格式（大疆官方文档）：",
          " * ch0 = (s[0]    | s[1]<<8)              & 0x07FF   右摇杆水平",
          " * ch1 = (s[1]>>3 | s[2]<<5)              & 0x07FF   右摇杆垂直",
          " * ch2 = (s[2]>>6 | s[3]<<2 | s[4]<<10)   & 0x07FF   左摇杆水平",
          " * ch3 = (s[4]>>1 | s[5]<<7)              & 0x07FF   左摇杆垂直",
          " * s1 = (s[5]>>4)&0x3   左拨杆   s2 = s[5]>>6   右拨杆 */",
          "",
          "void rc_decode(const uint8_t s[18], RcChannel *rc) {",
          "    rc->ch[0] = ((s[0]       | s[1] << 8)              & 0x07FF) - 1024;",
          "    rc->ch[1] = ((s[1] >> 3  | s[2] << 5)              & 0x07FF) - 1024;",
          "    rc->ch[2] = ((s[2] >> 6  | s[3] << 2 | s[4] << 10) & 0x07FF) - 1024;",
          "    rc->ch[3] = ((s[4] >> 1  | s[5] << 7)              & 0x07FF) - 1024;",
          "    rc->s1 = (s[5] >> 4) & 0x03;",
          "    rc->s2 = s[5] >> 6;",
          "    /* 减 1024 归中：静止时约 0，范围 ±660 */",
          "}"
        ].join("\n")),

          "",
          "void rc_on_frame(const uint8_t *data, uint16_t len) {",
          "    if (len != 18) return;         /* 长度不对直接丢弃 */",
          "    rc_decode(data, &rc);",
          "    rc_last_ms = now_ms();",
          "}",
          "",
          "bool rc_is_lost(void) {",
          "    return (now_ms() - rc_last_ms) > 100;   /* 100ms 无帧 = 断联 */",
          "}",
          "",
          "/* 主控循环里：断联 → 立即停电机（不经过任何 Fancy 逻辑） */"

          "/* 从裁判系统读：底盘实时功率 + 缓冲能量 */",
          "typedef struct {",
          "    float chassis_power;     /* 当前功率 W */",
          "    float buffer_energy;    /* 缓冲能量 J（满 60J） */",
          "} RefereePower;",
          "",
          "/* 功率限制：按比例缩放各电机电流 */",
          "void chassis_power_limit(const RefereePower *rp,",
          "                          float p_max, float cmd[4]) {",
          "    float scale = 1.0f;",
          "    if (rp->chassis_power > p_max) {",
          "        scale = p_max / rp->chassis_power;",
          "        /* 缓冲能量告急 → 更激进地削 */",
          "        if (rp->buffer_energy < 20.f) {",
          "            float extra = 0.5f * (20.f - rp->buffer_energy) / 20.f;",
          "            scale *= (1.f - extra);",
          "        }",
          "        if (scale < 0.f) scale = 0.f;",
          "    }",
          "    for (int i = 0; i < 4; i++) cmd[i] *= scale;",
          "}"
        ].join("\n")),
