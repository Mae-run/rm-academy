upper1 = np.array([10,  255, 255])

upper2 = np.array([180, 255, 255])

img = cv2.imread("field.jpg", cv2.IMREAD_GRAYSCALE)

# 固定阈值（简单但怕光照不均）

        ]),

import numpy as np

img = cv2.imread("noisy.png", cv2.IMREAD_GRAYSCALE)
_, binary = cv2.threshold(img, 127, 255, cv2.THRESH_BINARY)

kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (5, 5))   # 5×5 矩形核

# 开运算：去噪
opened = cv2.morphologyEx(binary, cv2.MORPH_OPEN, kernel)

# 闭运算：补洞
closed = cv2.morphologyEx(opened, cv2.MORPH_CLOSE, kernel)

cv2.imshow("Original", binary)
cv2.imshow("Opened", opened)
cv2.imshow("Closed", closed)
cv2.waitKey(0)`),

        H.prac({
          id: "cvp-p5", level: 2, title: "手写：灯条清理流水线",
          body: "读入一张有大量噪点的装甲板二值图，用形态学操作把孤立的噪点清掉、把断开的灯条连起来，输出清理后的图。要求：原图噪点完全消失，灯条形状不被破坏。",
          hint: "先开运算去噪，再闭运算补缝；核从 3×3 试起，不行再加。",

import numpy as np

img = cv2.imread("armor_noisy.png", cv2.IMREAD_GRAYSCALE)
_, binary = cv2.threshold(img, 127, 255, cv2.THRESH_BINARY)

k3 = cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3))
k5 = cv2.getStructuringElement(cv2.MORPH_RECT, (5, 5))

opened = cv2.morphologyEx(binary, cv2.MORPH_OPEN, k3)      # 去噪
closed = cv2.morphologyEx(opened, cv2.MORPH_CLOSE, k5)     # 补缝

cv2.imshow("Cleaned", closed)
cv2.waitKey(0)`)
        }),
      ]},

        H.code("python", "contour.py", `import cv2

img = cv2.imread("field.jpg")
gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
_, binary = cv2.threshold(gray, 200, 255, cv2.THRESH_BINARY)

contours, _ = cv2.findContours(binary, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)

print(f"找到 {len(contours)} 个轮廓")

# 遍历每个轮廓
for i, cnt in enumerate(contours):
    area = cv2.contourArea(cnt)                    # 面积
    perimeter = cv2.arcLength(cnt, True)           # 周长
    x, y, w, h = cv2.boundingRect(cnt)             # 外接矩形
    aspect = w / h if h > 0 else 0                 # 宽高比

    print(f"轮廓{i}: 面积={area:.0f}, 宽高比={aspect:.2f}, 位置=({x},{y})")

# 画出来
cv2.drawContours(img, contours, -1, (0, 255, 0), 2)
cv2.imshow("Contours", img)
cv2.waitKey(0)`),

          opts: ["轮廓的颜色", "面积 + 宽高比 + 绝对尺寸", "轮廓的中心点", "轮廓的周长"],

        }),
        H.prac({
          id: "cvp-p6", level: 3, title: "手写：装甲板灯条筛选器",
          body: "读入一张含多个目标的场地图，完成完整筛选流水线：二值化 → 形态学清理 → 找轮廓 → 按面积/宽高比/尺寸三条件筛选 → 把通过的轮廓用绿色框标出。输出筛选前后轮廓数量对比。",
          hint: "面积 100~5000 像素，宽高比 0.2~0.7，w 和 h 都 > 10。",
          solution: H.code("python", "answer.py", `import cv2

img = cv2.imread("field.jpg")
hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)
mask = cv2.inRange(hsv, (0,100,100), (10,255,255)) | \
       cv2.inRange(hsv, (160,100,100), (180,255,255))

kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3))
mask = cv2.morphologyEx(mask, cv2.MORPH_OPEN, kernel)

contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)
print(f"筛选前: {len(contours)} 个轮廓")

armor_bars = []
for cnt in contours:
    area = cv2.contourArea(cnt)
    if not (100 < area < 5000): continue
    x, y, w, h = cv2.boundingRect(cnt)
    if not (0.2 < w/h < 0.7): continue
    if w < 10 or h < 10: continue
    armor_bars.append((x, y, w, h))

print(f"筛选后: {len(armor_bars)} 个灯条")
for x, y, w, h in armor_bars:
    cv2.rectangle(img, (x, y), (x+w, y+h), (0, 255, 0), 2)

cv2.imshow("Armor Bars", img)
cv2.waitKey(0)`)

        H.p("RM 相机装在云台上，会跟着炮管转。图像也跟着旋转、拉伸。几何变换就是把图像<b>摆正、对齐、校正</b>的数学工具。"),
        H.code("python", "warp.py", `import cv2
import numpy as np

img = cv2.imread("armor.jpg")
h, w = img.shape[:2]

# 1. 旋转 30 度（围绕图像中心）
M = cv2.getRotationMatrix2D((w/2, h/2), 30, 1.0)
rotated = cv2.warpAffine(img, M, (w, h))

warped = cv2.warpPerspective(img, M2, (200, 200))

cv2.imshow("Rotated", rotated)
cv2.imshow("Warped", warped)
cv2.waitKey(0)`),

kp2, des2 = orb.detectAndCompute(img2, None)

    corners = np.float32([[0,0],[w,0],[w,h],[0,h]]).reshape(-1,1,2)

    cv2.polylines(img2_color, [np.int32(tracked)], True, (0,255,0), 3)

cap = cv2.VideoCapture(0)                    # 0 = 默认相机

cap.set(cv2.CAP_PROP_FPS, 60)

while True:

    for cnt in contours:

            cv2.rectangle(frame, (x, y), (x+w, y+h), (0, 255, 0), 2)

    # 计算帧率
    fps = 1.0 / (time.time() - t0)
    cv2.putText(frame, f"FPS: {fps:.1f}", (10, 30),

cap = cv2.VideoCapture(0)
cap.set(cv2.CAP_PROP_FRAME_WIDTH, 640)

    ret, frame = cap.read()

import numpy as np

# 棋盘格标定（9×6 内角点）
pattern_size = (9, 6)
square_size = 25.0    # mm

# 准备世界坐标系中的角点（Z=0 平面）
objp = np.zeros((pattern_size[0] * pattern_size[1], 3), np.float32)
objp[:, :2] = np.mgrid[0:pattern_size[0], 0:pattern_size[1]].T.reshape(-1, 2)
objp *= square_size

objpoints = []    # 世界坐标
imgpoints = []    # 图像坐标

# 拍 20 张不同角度的棋盘格
for i in range(20):
    img = cv2.imread(f"calib_{i:02d}.jpg")
    gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
    ret, corners = cv2.findChessboardCorners(gray, pattern_size, None)
    if ret:
        objpoints.append(objp)
        corners_refined = cv2.cornerSubPix(gray, corners, (11,11), (-1,-1),
            (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, 30, 0.001))
        imgpoints.append(corners_refined)

# 标定
ret, K, dist, rvecs, tvecs = cv2.calibrateCamera(
    objpoints, imgpoints, gray.shape[::-1], None, None)

print("内参矩阵 K:")
print(K)
print("畸变系数:", dist.ravel())

# 去畸变
img = cv2.imread("test.jpg")
undistorted = cv2.undistort(img, K, dist)
cv2.imwrite("undistorted.jpg", undistorted)`),
